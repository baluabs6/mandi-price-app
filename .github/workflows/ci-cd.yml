name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  BACKEND_IMAGE: mandi-backend
  FRONTEND_IMAGE: mandi-frontend

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mandi_test_db
          POSTGRES_USER: mandi_user
          POSTGRES_PASSWORD: mandi_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r backend/requirements.txt || echo "::warning::pip-audit found issues — review before merging"
      - name: Run tests
        working-directory: backend
        env:
          FLASK_ENV: testing
          # deliberately no TEST_DATABASE_URL/REDIS_URL — falls back to
          # in-memory SQLite + NullCache so this job needs no live infra
          # for the unit suite; swap in the services above for real
          # Postgres/Redis integration coverage if you add it later.
        run: pytest -q --cov=. --cov-report=term-missing

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Dependency vulnerability scan
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit found issues — review before merging"
      - name: Test
        working-directory: frontend
        run: CI=true npx react-scripts test --watchAll=false
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npx eslint src --max-warnings=0 || true

  build-and-push:
    needs: [secret-scan, test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push backend image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
                        -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:latest ./backend
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
                        -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:latest \
                        --build-arg REACT_APP_API_BASE_URL=/api ./frontend
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:latest

      - name: Scan images for known vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # report only — flip to "1" to hard-block once the team has triaged the baseline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # NOTE: uses a long-lived AZURE_CREDENTIALS service-principal secret.
      # Recommended follow-up (needs real Azure AD access to set up, not
      # done here): switch to OIDC federated credentials so no long-lived
      # secret is stored in GitHub at all —
      # https://learn.microsoft.com/azure/developer/github/connect-from-azure-openid-connect
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container Apps to new image
        run: |
          az containerapp update \
            --name mandiapp-prod-backend \
            --resource-group mandiapp-prod-rg \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          az containerapp update \
            --name mandiapp-prod-frontend \
            --resource-group mandiapp-prod-rg \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Smoke test
        run: |
          curl -f https://mandiapp-prod-backend.azurecontainerapps.io/api/health
